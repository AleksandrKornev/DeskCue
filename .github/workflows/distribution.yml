name: Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve release tag once
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_VERSION" in
            ''|*[!0-9A-Za-z.-]*) echo 'Invalid release version.' >&2; exit 1 ;;
          esac
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/v$RELEASE_VERSION" "refs/tags/v$RELEASE_VERSION^{}")"
          commit="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$commit" ]; then
            commit="$(printf '%s\n' "$refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          fi
          [ -n "$commit" ] || { echo "Release tag v$RELEASE_VERSION was not found." >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: resolve-source
    runs-on: windows-2022
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $env:RELEASE_VERSION) { throw "Tag input and package version differ." }
          npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Publish tray
        run: dotnet publish apps/tray/DeskCue.Tray/DeskCue.Tray.csproj -c Release -r win-x64 --self-contained true

      - name: Locate runtime notices
        id: dotnet
        shell: pwsh
        run: |
          $runtimeLine = dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft.NETCore.App 10\.' } | Select-Object -Last 1
          $desktopLine = dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft.WindowsDesktop.App 10\.' } | Select-Object -Last 1
          if (-not $runtimeLine -or -not $desktopLine) { throw 'Required .NET 10 runtimes are missing.' }
          $runtimeVersion = ($runtimeLine -split '\s+')[1]
          $runtimeBase = (($runtimeLine -split '\s+')[2]).Trim('[', ']')
          $desktopBase = (($desktopLine -split '\s+')[2]).Trim('[', ']')
          "version=$runtimeVersion" >> $env:GITHUB_OUTPUT
          "license=$(Join-Path $runtimeBase $runtimeVersion 'LICENSE.TXT')" >> $env:GITHUB_OUTPUT
          "notices=$(Join-Path $runtimeBase $runtimeVersion 'THIRD-PARTY-NOTICES.TXT')" >> $env:GITHUB_OUTPUT
          "desktop-license=$(Join-Path $desktopBase $runtimeVersion 'LICENSE')" >> $env:GITHUB_OUTPUT

      - name: Test tray identity and behavior
        shell: pwsh
        run: dotnet test apps/tray/DeskCue.Tray.Tests/DeskCue.Tray.Tests.csproj --configuration Release

      - name: Build verified Windows payload
        shell: pwsh
        run: |
          node tooling/windows-installer/build-payload.mjs `
            --dotnet-runtime-version '${{ steps.dotnet.outputs.version }}' `
            --dotnet-license '${{ steps.dotnet.outputs.license }}' `
            --dotnet-notices '${{ steps.dotnet.outputs.notices }}' `
            --windowsdesktop-license '${{ steps.dotnet.outputs.desktop-license }}'
          node tooling/windows-installer/verify-payload.mjs

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: nuget install Tools.InnoSetup -Version 7.1.0 -OutputDirectory .tools -NonInteractive

      - name: Build installer and portable archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $iscc = Get-ChildItem .tools/Tools.InnoSetup.7.1.0 -Recurse -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw 'Pinned ISCC.exe was not found.' }
          pwsh -File tooling/windows-installer/compile-installer.ps1 -IsccPath $iscc.FullName
          $output = 'tooling/distribution/dist/windows-x64'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $installer = "tooling/windows-installer/dist/installer/DeskCueSetup-$env:RELEASE_VERSION-win-x64.exe"
          Copy-Item $installer $output
          Copy-Item "$installer.sha256" $output
          $zip = Join-Path $output "DeskCue-$env:RELEASE_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path 'tooling/windows-installer/dist/payload/*' -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -NoNewline "$zip.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-windows-x64
          path: tooling/distribution/dist/windows-x64/*
          if-no-files-found: error

  linux:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Test distribution contracts
        run: npm run test:distribution

      - name: Build Linux packages
        run: npm run build:linux-package -- --arch '${{ matrix.architecture }}'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-linux-${{ matrix.architecture }}
          path: tooling/linux-package/dist/packages/*
          if-no-files-found: error

  draft-release:
    needs:
      - linux
      - resolve-source
      - windows-x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          path: release
          merge-multiple: true

      - name: Create update manifest and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tooling/distribution/create-release-metadata.mjs \
            --channel stable \
            --directory release \
            --version "$RELEASE_VERSION"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/v$RELEASE_VERSION" "refs/tags/v$RELEASE_VERSION^{}")"
          current_commit="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$current_commit" ]; then
            current_commit="$(printf '%s\n' "$refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          fi
          if [ "$current_commit" != "$SOURCE_COMMIT" ]; then
            echo "Release tag v$RELEASE_VERSION moved after artifact builds started." >&2
            exit 1
          fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" release/* \
            --draft \
            --generate-notes \
            --title "DeskCue v$RELEASE_VERSION" \
            --verify-tag

      - name: Record manual publish gates
        run: |
          {
            echo '### Draft release validation'
            echo '- [ ] Install and exercise the Windows x64 installer on a clean Windows environment'
            echo '- [ ] Install, update and roll back the Linux x64 standalone artifact'
            echo '- [ ] Install, update and roll back the Linux arm64 standalone artifact on arm64 hardware'
            echo '- [ ] Install both Debian packages and verify Host lifecycle after replacement'
            echo '- [ ] Verify draft asset names, SHA256SUMS and update-manifest-v1.json before publishing'
            echo '- [ ] Re-resolve the release tag and confirm it still matches the recorded source commit'
          } >> "$GITHUB_STEP_SUMMARY"
