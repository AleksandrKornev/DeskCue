name: Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version without the v prefix
        required: true
        type: string
permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-22.04
    outputs:
      baseline_commit: ${{ steps.resolve.outputs.baseline_commit }}
      baseline_version: ${{ steps.resolve.outputs.baseline_version }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve release tag once
        id: resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq \
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || {
            echo 'Release version must be a stable SemVer value.' >&2
            exit 1
          }
          tag_refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/v*')"
          refs="$(printf '%s\n' "$tag_refs" | awk -v tag="refs/tags/v$RELEASE_VERSION" \
            '$2 == tag || $2 == tag "^{}"')"
          commit="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$commit" ]; then
            commit="$(printf '%s\n' "$refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          fi
          [ -n "$commit" ] || { echo "Release tag v$RELEASE_VERSION was not found." >&2; exit 1; }
          stable_versions="$(printf '%s\n' "$tag_refs" | awk '$2 !~ /\^\{\}$/ {
            ref = $2
            sub("^refs/tags/v", "", ref)
            if (ref ~ /^[0-9]+\.[0-9]+\.[0-9]+$/) print ref
          }' | sort -V -u)"
          baseline_version="$(printf '%s\n' "$stable_versions" | awk -v release="$RELEASE_VERSION" \
            '$0 == release { print previous; exit } { previous = $0 }')"
          [ -n "$baseline_version" ] || {
            echo "No previous stable release tag exists before v$RELEASE_VERSION." >&2
            exit 1
          }
          baseline_refs="$(printf '%s\n' "$tag_refs" | awk \
            -v tag="refs/tags/v$baseline_version" '$2 == tag || $2 == tag "^{}"')"
          baseline_commit="$(printf '%s\n' "$baseline_refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$baseline_commit" ]; then
            baseline_commit="$(printf '%s\n' "$baseline_refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          fi
          [ -n "$baseline_commit" ] || {
            echo "Baseline tag v$baseline_version was not found." >&2
            exit 1
          }
          echo "baseline_commit=$baseline_commit" >> "$GITHUB_OUTPUT"
          echo "baseline_version=$baseline_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  windows-x64:
    needs: resolve-source
    runs-on: windows-2022
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $env:RELEASE_VERSION) { throw "Tag input and package version differ." }
          npm run version:check

      - name: Install dependencies
        run: npm ci

      - name: Publish tray
        run: dotnet publish apps/tray/DeskCue.Tray/DeskCue.Tray.csproj -c Release -r win-x64 --self-contained true

      - name: Locate runtime pack notices
        id: dotnet
        shell: pwsh
        run: |
          $assets = Get-Content apps/tray/DeskCue.Tray/obj/project.assets.json -Raw | ConvertFrom-Json
          $framework = $assets.project.frameworks.PSObject.Properties.Value | Select-Object -First 1
          $packagesPath = $assets.project.restore.packagesPath
          $runtimePack = @($framework.downloadDependencies | Where-Object name -eq 'Microsoft.NETCore.App.Runtime.win-x64')
          $desktopPack = @($framework.downloadDependencies | Where-Object name -eq 'Microsoft.WindowsDesktop.App.Runtime.win-x64')
          if (-not $packagesPath -or $runtimePack.Count -ne 1 -or $desktopPack.Count -ne 1) {
            throw 'Required win-x64 runtime pack metadata is missing.'
          }
          $runtimeRange = [regex]::Match($runtimePack[0].version, '^\[(?<min>\d+\.\d+\.\d+),\s*(?<max>\d+\.\d+\.\d+)\]$')
          $desktopRange = [regex]::Match($desktopPack[0].version, '^\[(?<min>\d+\.\d+\.\d+),\s*(?<max>\d+\.\d+\.\d+)\]$')
          if (-not $runtimeRange.Success -or -not $desktopRange.Success) {
            throw 'Required win-x64 runtime pack versions are malformed.'
          }
          $runtimeVersion = $runtimeRange.Groups['min'].Value
          $desktopVersion = $desktopRange.Groups['min'].Value
          if ($runtimeVersion -ne $runtimeRange.Groups['max'].Value -or
              $desktopVersion -ne $desktopRange.Groups['max'].Value -or
              $runtimeVersion -ne $desktopVersion) {
            throw "Required win-x64 runtime pack versions do not match exactly: NETCore=$($runtimePack[0].version), WindowsDesktop=$($desktopPack[0].version)."
          }
          $runtimeBase = Join-Path (Join-Path $packagesPath $runtimePack[0].name.ToLowerInvariant()) $runtimeVersion
          $desktopBase = Join-Path (Join-Path $packagesPath $desktopPack[0].name.ToLowerInvariant()) $desktopVersion
          $license = Join-Path $runtimeBase 'LICENSE.TXT'
          $notices = Join-Path $runtimeBase 'THIRD-PARTY-NOTICES.TXT'
          $desktopLicense = Join-Path $desktopBase 'LICENSE'
          $noticeFiles = @($license, $notices, $desktopLicense)
          $missing = @($noticeFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) { throw "Required runtime pack notice files are missing: $($missing -join ', ')." }
          "version=$runtimeVersion" >> $env:GITHUB_OUTPUT
          "license=$license" >> $env:GITHUB_OUTPUT
          "notices=$notices" >> $env:GITHUB_OUTPUT
          "desktop-license=$desktopLicense" >> $env:GITHUB_OUTPUT

      - name: Test tray identity and behavior
        shell: pwsh
        run: dotnet test apps/tray/DeskCue.Tray.Tests/DeskCue.Tray.Tests.csproj --configuration Release

      - name: Build verified Windows payload
        shell: pwsh
        run: |
          node tooling/windows-installer/build-payload.mjs `
            --dotnet-runtime-version '${{ steps.dotnet.outputs.version }}' `
            --dotnet-license '${{ steps.dotnet.outputs.license }}' `
            --dotnet-notices '${{ steps.dotnet.outputs.notices }}' `
            --windowsdesktop-license '${{ steps.dotnet.outputs.desktop-license }}'
          node tooling/windows-installer/verify-payload.mjs

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: nuget install Tools.InnoSetup -Version 7.1.0 -OutputDirectory .tools -NonInteractive

      - name: Build installer and portable archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $iscc = Get-ChildItem .tools/Tools.InnoSetup.7.1.0 -Recurse -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw 'Pinned ISCC.exe was not found.' }
          pwsh -File tooling/windows-installer/compile-installer.ps1 -IsccPath $iscc.FullName
          $output = 'tooling/distribution/dist/windows-x64'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $installer = "tooling/windows-installer/dist/installer/DeskCueSetup-$env:RELEASE_VERSION-win-x64.exe"
          Copy-Item $installer $output
          Copy-Item "$installer.sha256" $output
          $zip = Join-Path $output "DeskCue-$env:RELEASE_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path 'tooling/windows-installer/dist/payload/*' -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -NoNewline "$zip.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-windows-x64
          path: tooling/distribution/dist/windows-x64/*
          if-no-files-found: error

  linux:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-22.04
          - architecture: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "if (require('./package.json').version !== process.env.RELEASE_VERSION) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Test distribution contracts
        run: npm run test:distribution

      - name: Build Linux packages
        run: npm run build:linux-package -- --arch '${{ matrix.architecture }}'

      - name: Checkout baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .release-baseline
          ref: ${{ needs.resolve-source.outputs.baseline_commit }}

      - name: Build native baseline packages
        working-directory: .release-baseline
        run: |
          npm ci
          npm run build:linux-package -- --arch '${{ matrix.architecture }}'

      - name: Prepare non-root user service session
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Test native install, update and rollback gates
        env:
          DESKCUE_RELEASE_GATE: "1"
        run: |
          node tooling/linux-package/release-gate.mjs \
            --arch '${{ matrix.architecture }}' \
            --baseline-dir '.release-baseline/tooling/linux-package/dist/packages' \
            --baseline-version '${{ needs.resolve-source.outputs.baseline_version }}' \
            --candidate-dir 'tooling/linux-package/dist/packages' \
            --candidate-version '${{ inputs.version }}'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-linux-${{ matrix.architecture }}
          path: tooling/linux-package/dist/packages/*
          if-no-files-found: error

  draft-release:
    needs:
      - linux
      - resolve-source
      - windows-x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.0

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          path: release
          merge-multiple: true

      - name: Create update manifest and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tooling/distribution/create-release-metadata.mjs \
            --channel stable \
            --directory release \
            --version "$RELEASE_VERSION"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve-source.outputs.commit }}
        run: |
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/v$RELEASE_VERSION" "refs/tags/v$RELEASE_VERSION^{}")"
          current_commit="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          if [ -z "$current_commit" ]; then
            current_commit="$(printf '%s\n' "$refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          fi
          if [ "$current_commit" != "$SOURCE_COMMIT" ]; then
            echo "Release tag v$RELEASE_VERSION moved after artifact builds started." >&2
            exit 1
          fi
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" release/* \
            --draft \
            --generate-notes \
            --title "DeskCue v$RELEASE_VERSION" \
            --verify-tag

      - name: Record manual publish gates
        run: |
          {
            echo '### Draft release validation'
            echo '- [ ] Install and exercise the Windows x64 installer on a clean Windows environment'
            echo '- [x] Native non-root install, update and induced rollback passed for Linux x64 and arm64'
            echo '- [x] Both Debian packages passed native install, Host lifecycle and data-preservation smoke'
            echo '- [ ] Verify draft asset names, SHA256SUMS and update-manifest-v1.json before publishing'
            echo '- [ ] Re-resolve the release tag and confirm it still matches the recorded source commit'
          } >> "$GITHUB_STEP_SUMMARY"
